services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-event-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smart-event-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped