[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "AGENT_RAG_README.md"
authors = [
    { name = "Swati Swagatika Sahoo", email = "swatiswagatikasahoo32@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.19.1",
    "bcrypt>=4.0.1,<4.1.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "passlib>=1.7.4",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.20",
    "python-jose>=3.5.0",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.4",
    # --- Agent + RAG (added for the AI layer) ---
    "langgraph>=0.2.60",
    "langchain-core>=0.3.30",
    "langchain-openai>=0.3.0",
    "openai>=1.60.0",
    "pgvector>=0.3.6",
    "markitdown[pdf,docx,pptx,xlsx]>=0.0.1a3",
]

[project.optional-dependencies]
# Local cross-encoder reranking. Only needed if you set the reranker backend
# to "cross_encoder"; the default LLM reranker needs none of this.
rerank-local = [
    "sentence-transformers>=3.3.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
